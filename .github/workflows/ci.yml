name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:buckets:seed
      - run: npm run db:lint
      - run: npm run db:test
      - run: npm run db:types:check
      - name: Generate database types for drift diagnosis
        if: failure()
        run: mkdir -p .tmp && npx supabase gen types --local --schema public,private > .tmp/database.types.generated.ts
      - name: Upload generated database types
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-database-types
          path: .tmp/database.types.generated.ts
          if-no-files-found: ignore
          retention-days: 1
      - run: npm run typecheck
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
